[package]
name = "chatgpt-dialog-assistant"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.85"
description = "Windows 本地会话历史编辑器"
license = "MIT"

[build-dependencies]
embed-resource = "3.0.6"

[dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com",
    "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
chrono = "0.4"
zstd = "0.13"
regex = "1.10"
toml = "0.8"
tempfile = "3"
fs2 = "0.4"

[profile.dev]
debug = 0

