[package]
name = "chatgpt-dialog-assistant"
# Tauri CLI requires a SemVer value for its build. The release has no version resource.
version = "0.0.0"
publish = false
description = "ChatGPT local history editor"
authors = ["CC Switch contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"
autotests = false

[lib]
name = "chatgpt_dialog_assistant_lib"
crate-type = ["rlib"]
doctest = false

[[bin]]
name = "chatgpt-dialog-assistant"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.8.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
chrono = "0.4"
zstd = "0.13"
regex = "1.10"
toml = "0.8"
tempfile = "3"
fs2 = "0.4"

[profile.dev]
debug = 0

